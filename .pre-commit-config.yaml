---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: check-added-large-files
        args:
          - '--maxkb=4096'
      - id: check-merge-conflict
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        types:
          - file
        files: \.en\.(md|html|toml)$
  - repo: https://github.com/mit-d/check-unicode
    rev: v0.6.0
    hooks:
      - id: check-unicode
        args:
          - --allow-category
          - Ll  # Allow Letter lowercase (including accents)
          - --allow-category
          - Lu  # Allow Letter uppercase (including accents)
          - --allow-category
          - So  # Emojis
          - --allow-codepoint
          - U+00B7  # Allow MiddleDot
          - --allow-codepoint
          - U+20AC  # Allow Euro symbol
  - repo: local
    hooks:
      - id: app-prettier
        name: run prettier
        language: system
        files: ^.*$
        types_or:
          - markdown
          - html
          - css
          - scss
          - svg
        entry: |
          npx prettier -w --

ci:
  autofix_commit_msg: |
    fix(pre-commit.ci): auto fixes from pre-commit.com hooks

    For more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: 'chore(pre-commit.ci): pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
