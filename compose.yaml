---
services:
  hugo:
    image: docker.io/hugomods/hugo:dart-sass-node-git-non-root-0.164.0
    ports:
      - '1313:1313'
    volumes:
      - ./:/src
      # Keep node_modules out of the host bind mount: it's installed on the host (glibc) via `npm ci`
      # for local tooling, but this image is Alpine/musl, so native deps (e.g. lightningcss) need their
      # own musl build installed inside the container.
      - ./.docker/node_modules:/src/node_modules
    command: >
      sh -c "npm ci --loglevel info && hugo server --bind 0.0.0.0 --baseURL=http://localhost:1313/ --buildDrafts --buildFuture
      --enableGitInfo=true --disableFastRender --printI18nWarnings --watch=true"
    network_mode: bridge
