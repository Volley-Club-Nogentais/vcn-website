{{ define "css" }}
  <style>
    .home-image {
      {{ with resources.Get "media/8774fde28f1480f16e4bacfe21705053-scaled.jpg" }}
        {{ with .Fill "1600x560" }}
          background-image: url({{ .RelPermalink }});
        {{ end }}
      {{ end }}
    }
  </style>
{{ end }}

{{ define "main" }}
  <section class="home-image hidden nav:flex">
    <div class="bottom-div">
      {{ with resources.Get "media/vcn_monogramme_v1_gold.svg" }}
        <img class="h-auto w-[270px] max-w-full p-[1%]" alt="Club monogramme" src="{{ .RelPermalink }}" />
      {{ end }}
    </div>
    <div class="top-div">
      <h1 class="uppercase">{{ .Title }}</h1>
      {{ .Content }}
    </div>
  </section>
  <section class="flex text-center nav:hidden">
    <h1 class="uppercase">{{ .Title }}</h1>
    {{ .Content }}
  </section>
  <section class="mt-5">
    <h2>Dernières actualités</h2>
    {{ partial "latest-posts.html" . }}
  </section>
  {{ partial "next-games.html" . }}
{{ end }}
