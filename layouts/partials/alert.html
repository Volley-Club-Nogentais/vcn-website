{{ if hugo.IsDevelopment }}
  <div class="alert alert-warning text-center" role="alert">⚠️ Version de pré-production ⚠️</div>
{{ end }}

{{ with .Site.Params.alert }}
  <div class="alert alert-{{ .level }} text-center" role="alert">
    {{ .text }}
    {{ with .link }}
      <br /><a href="{{ . }}" class="alert-link">En savoir plus</a>
    {{ end }}
  </div>
{{ end }}
