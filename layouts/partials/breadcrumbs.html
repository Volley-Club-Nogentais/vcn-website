{{ if not .IsHome }}
  <nav aria-label="breadcrumb" class="py-2 text-sm">
    <ol class="flex flex-wrap items-center gap-2 text-vcn-blue dark:text-(--color-dark-fg)">
      {{- range .Ancestors.Reverse }}
        <li class="flex items-center gap-2">
          <a class="hover:underline" href="{{ .RelPermalink }}">
            {{ if .IsHome }}
              {{ partial "icon.html" (dict "name" "house") }}
            {{ else }}
              {{ .Title }}
            {{- end }}
          </a>
          <span aria-hidden="true" class="text-vcn-secondary/50 dark:text-(--color-dark-fg-muted)">/</span>
        </li>
      {{- end }}
      <li class="font-bold" aria-current="page">{{ .Title }}</li>
    </ol>
  </nav>
{{- end }}
