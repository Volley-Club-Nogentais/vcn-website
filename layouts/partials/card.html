<div class="relative flex flex-col rounded border border-black/10 bg-white">
  <div class="card-body p-4">
    <h4 class="font-heading text-xl font-extrabold text-vcn-blue">{{ .Title }}</h4>
    {{ with .Params.author }}
      <p class="-mt-1.5 text-gray-500">par {{ . }}</p>
    {{ end }}
    <p class="mt-3">{{ .Summary }}</p>
    {{ if .Truncated }}
      <a
        href="{{ .RelPermalink }}"
        class="relative inline-block rounded border border-vcn-blue px-5 py-2.5 font-bold text-vcn-blue transition-colors before:absolute before:inset-0 before:content-[''] hover:bg-vcn-blue hover:text-white"
        >En savoir plus</a
      >
    {{ end }}
  </div>
  {{ with .Date }}
    <div class="border-t border-black/10 bg-black/3 px-4 py-2">
      <small class="text-gray-500">{{ . | time.Format ":date_long" }}</small>
    </div>
  {{ end }}
</div>
