{{- range site.Menus.main }}
  <li>
    <a
      class="px-2 font-heading font-extrabold text-vcn-blue dark:text-(--color-dark-fg) {{ with .Params.class -}}
        {{ . }}
      {{ end -}}"
      href="{{ .URL }}"
      >{{ .Name }}</a
    >
  </li>
{{- end }}
{{ with .Site.Params.adhesionLink }}
  <li>
    <a
      class="px-2 font-heading font-extrabold text-vcn-blue dark:text-(--color-dark-fg)"
      target="_blank"
      rel="noopener noreferrer"
      href="{{ . }}"
      >Inscriptions</a
    >
  </li>
{{ end }}
