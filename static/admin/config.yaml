---
local_backend: true

backend:
  name: github
  repo: Volley-Club-Nogentais/vcn-website
  branch: main
  commit_messages:
    create: "feat({{collection}}): create '{{slug}}' by {{author-login}}"
    update: "feat({{collection}}): update '{{slug}}' by {{author-login}}"
    delete: "feat({{collection}}): delete '{{slug}}' by {{author-login}}"
    uploadMedia: "feat(media): upload '{{path}}' by {{author-login}}"
    deleteMedia: "feat(media): delete '{{path}}' by {{author-login}}"
    openAuthoring: '{{message}}'
  # When using the Editorial Workflow with the github or GitHub-connected git-gateway backends, Decap CMS creates a
  # pull request for each unpublished entry. Every time the unpublished entry is changed and saved, a new commit is
  # added to the pull request. When the entry is published, the pull request is merged, and all of those commits are
  # added to your project commit history in a merge commit.
  # Works with publish_mode
  squash_merges: true

media_folder: 'assets/media'
public_folder: '/media'

slug:
  encoding: 'ascii'
  clean_accents: true
  sanitize_replacement: '_'

i18n:
  # Required and can be one of multiple_folders, multiple_files or single_file
  # multiple_folders - persists files in `<folder>/<locale>/<slug>.<extension>`
  # multiple_files - persists files in `<folder>/<slug>.<locale>.<extension>`
  # single_file - persists a single file in `<folder>/<slug>.<extension>`
  structure: multiple_files
  # Required - a list of locales to show in the editor UI
  locales:
    - fr
  # Optional, defaults to the first item in locales.
  # The locale to be used for fields validation and as a baseline for the entry.
  default_locale: fr

# Adds an interface for drafting, reviewing, and approving posts
publish_mode: "editorial_workflow"

collections:
  - name: 'pages'
    label: 'Pages'
    files:
      - name: 'accueil'
        label: 'Accueil'
        file: 'content/_index.fr.md'
        fields:
          - label: 'Titre'
            name: 'title'
            widget: 'string'
            required: true
          - label: 'Date'
            name: 'date'
            widget: 'datetime'
            required: true
          - label: 'Brouillon'
            name: 'draft'
            widget: 'boolean'
            default: false
            required: true
          - label: 'Plan du site'
            name: 'sitemap'
            widget: 'object'
            required: false
            collapsed: true
            fields:
              - label: 'Priorité'
                name: 'priority'
                widget: 'number'
                value_type: 'float'
                min: 0
                max: 1
                required: false
              - label: 'Fréquence de changement'
                name: 'changeFreq'
                widget: 'select'
                options: ['always', 'hourly', 'daily', 'weekly', 'monthly', 'yearly', 'never']
                required: false
          - label: 'Contenu'
            name: 'body'
            widget: 'markdown'
            required: false

      - name: 'club'
        label: 'Le Club'
        file: 'content/club/_index.fr.md'
        fields:
          - label: 'Titre'
            name: 'title'
            widget: 'string'
            required: true
          - label: 'Contenu'
            name: 'body'
            widget: 'markdown'
            required: false

      - name: 'histoire'
        label: "Histoire du club"
        file: 'content/histoire.fr.md'
        fields:
          - label: 'Titre'
            name: 'title'
            widget: 'string'
            required: true
          - label: 'Brouillon'
            name: 'draft'
            widget: 'boolean'
            default: false
            required: true
          - label: 'Images'
            name: 'image'
            widget: 'list'
            required: false
          - label: 'Contenu'
            name: 'body'
            widget: 'markdown'
            required: true

      - name: 'mentions_legales'
        label: 'Mentions légales'
        file: 'content/mentions-legales.fr.md'
        fields:
          - label: 'Titre'
            name: 'title'
            widget: 'string'
            required: true
          - label: 'Brouillon'
            name: 'draft'
            widget: 'boolean'
            default: true
            required: true
            hint: "Laisser sur 'oui' tant que les champs [À COMPLÉTER] du contenu n'ont pas été remplis."
          - label: 'Contenu'
            name: 'body'
            widget: 'markdown'
            required: true

      - name: 'contact'
        label: 'Contact'
        file: 'content/contact/index.fr.md'
        fields:
          - label: 'Titre'
            name: 'title'
            widget: 'string'
            required: true
          - label: 'Contenu'
            name: 'body'
            widget: 'markdown'
            required: false

      - name: 'inscriptions'
        label: 'Inscriptions'
        file: 'content/inscriptions/index.fr.md'
        fields:
          - label: 'Titre'
            name: 'title'
            widget: 'string'
            required: true
          - label: 'Contenu'
            name: 'body'
            widget: 'markdown'
            required: false

      - name: 'actualites_index'
        label: "Actualités (page d'index)"
        file: 'content/actualites/_index.fr.md'
        fields:
          - label: 'Titre'
            name: 'title'
            widget: 'string'
            required: true
          - label: 'Date'
            name: 'date'
            widget: 'datetime'
            required: true
          - label: 'Plan du site'
            name: 'sitemap'
            widget: 'object'
            required: false
            collapsed: true
            fields:
              - label: 'Priorité'
                name: 'priority'
                widget: 'number'
                value_type: 'float'
                min: 0
                max: 1
                required: false
              - label: 'Fréquence de changement'
                name: 'changeFreq'
                widget: 'select'
                options: ['always', 'hourly', 'daily', 'weekly', 'monthly', 'yearly', 'never']
                required: false
          - label: 'Contenu'
            name: 'body'
            widget: 'markdown'
            required: false

      - name: 'equipes_index'
        label: "Équipes (page d'index)"
        file: 'content/equipes/_index.fr.md'
        fields:
          - label: 'Titre'
            name: 'title'
            widget: 'string'
            required: true
          - label: 'Brouillon'
            name: 'draft'
            widget: 'boolean'
            default: false
            required: true

      - name: 'beach'
        label: 'Beach Volley'
        file: 'content/beach/index.fr.md'
        fields:
          - label: 'Titre'
            name: 'title'
            widget: 'string'
            required: true
          - label: 'Résumé'
            name: 'summary'
            widget: 'string'
            required: false
          - label: 'Brouillon'
            name: 'draft'
            widget: 'boolean'
            default: false
            required: true
          - label: "Categories"
            name: "categories"
            widget: "select"
            multiple: true
            options:
              - "FFVB"
              - "FSGT"
              - "adultes"
              - "jeunes"
              - "beach"
          - label: 'Galerie'
            name: 'gallery'
            widget: 'image'
            multiple: true
            required: false
            media_folder: 'images'
            public_folder: 'images'
            media_library:
              config:
                max_file_size: 2048000
          - label: 'Contenu'
            name: 'body'
            widget: 'markdown'
            required: false

  - name: 'actualites'
    label: 'Actualités'
    folder: 'content/actualites'
    create: true
    path: "{{year}}/{{month}}/{{slug}}/index.fr"
    preview_path: "actualites/{{year}}/{{month}}/{{slug}}"
    fields:
      - label: 'Titre'
        name: 'title'
        widget: 'string'
        required: true
      - label: 'Auteur'
        name: 'author'
        widget: 'string'
        required: true
      - label: 'Résumé'
        name: 'summary'
        widget: 'string'
        required: false
        hint: "Optionnel : remplace le résumé automatiquement généré avant le séparateur '<!--more-->'."
      - label: 'Date'
        name: 'date'
        widget: 'datetime'
        required: true
        default: '{{now}}'
        date_format: true
        time_format: false
      - label: 'Brouillon'
        name: 'draft'
        widget: 'boolean'
        default: true
        required: true
      - label: 'Tags'
        name: 'tags'
        widget: 'list'
        required: false
      - label: 'Image principale'
        name: 'image'
        widget: 'image'
        required: false
        media_folder: 'media'
        public_folder: 'media'
        media_library:
          config:
            max_file_size: 2048000
      - label: 'Contenu'
        name: 'body'
        widget: 'markdown'
        required: true
        hint: "Ajoutez '<!--more-->' à l'endroit où le résumé de l'article doit s'arrêter."

  - name: 'equipes'
    label: 'Équipes'
    folder: 'content/equipes'
    create: true
    path: '{{slug}}/index.fr'
    preview_path: "equipes/{{slug}}"
    fields:
      - label: 'Titre'
        name: 'title'
        widget: 'string'
        required: true
      - label: 'Résumé'
        name: 'summary'
        widget: 'string'
        required: false
      - label: "Categories"
        name: "categories"
        widget: "select"
        multiple: true
        options:
          - "FFVB"
          - "FSGT"
          - "adultes"
          - "jeunes"
          - "beach"
      - label: 'Brouillon'
        name: 'draft'
        widget: 'boolean'
        default: true
        required: true
      - label: 'Positionnement'
        name: 'weight'
        widget: 'number'
        value_type: "int"
        default: 50
        min: 0
        max: 100
        required: false
      - label: 'Nom du calendrier'
        name: 'calendarName'
        widget: 'string'
        required: false
        hint: "Doit correspondre à une entrée du calendrier importé dans data/calendars (ex: regional_feminines)."
      - label: 'Image principale'
        name: 'image'
        widget: 'image'
        required: false
        multiple: false
        media_folder: "images"
        public_folder: "images"
        media_library:
          config:
            max_file_size: 2048000
      - label: 'Galerie'
        name: 'gallery'
        widget: 'image'
        multiple: true
        required: false
        media_folder: 'images'
        public_folder: 'images'
        media_library:
          config:
            max_file_size: 2048000
      - label: 'Entraînements'
        name: 'schedule'
        widget: 'list'
        required: false
        hint: "Affiché sur la page équipe et récapitulé sur la page Contact."
        fields:
          - label: 'Gymnase'
            name: 'gym'
            widget: 'select'
            options:
              - { label: 'Maudry', value: 'maudry' }
              - { label: 'Watteau', value: 'watteau' }
              - { label: 'Louis Armand', value: 'louis-armand' }
          - label: 'Jour de la semaine'
            name: 'day'
            widget: 'select'
            options:
              - 'Lundi'
              - 'Mardi'
              - 'Mercredi'
              - 'Jeudi'
              - 'Vendredi'
              - 'Samedi'
              - 'Dimanche'
          - label: 'Horaire de début'
            name: 'start'
            widget: 'string'
            hint: "Format HH:MM (ex: 20:00)."
          - label: 'Horaire de fin'
            name: 'end'
            widget: 'string'
            hint: "Format HH:MM (ex: 22:30)."
      - label: 'Contenu'
        name: 'body'
        widget: 'markdown'
        required: false
